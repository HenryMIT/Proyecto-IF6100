<header
  id="frontend-contend"
  class="w-full bg-neutral-900 text-white shadow-sm"
>
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Contenedor principal -->
    <div class="flex flex-wrap items-center justify-between gap-y-3 py-3">

      <!-- Logo + texto -->
      <div class="flex items-center gap-3 flex-shrink-0">
        <div class="bg-white rounded-md overflow-hidden">
          <img src="logo.jpg" alt="RUMI" class="h-10 sm:h-12 md:h-30 w-auto" />
        </div>

        <div class="flex flex-col leading-tight">
          <span class="text-base sm:text-lg md:text-[20px] font-normal text-white">Equipos</span>
          <span class="text-base sm:text-lg md:text-[20px] font-normal text-white">Rummi</span>
        </div>
      </div>

      <!-- NAV: en columna en móvil, en fila en md+ -->
      <div class="w-full md:w-auto">
        <ul
          class="font-medium text-sm sm:text-base
                 flex flex-col md:flex-row md:items-center
                 gap-1.5 md:gap-6
                 mt-2 md:mt-0"
        >
          <!-- Inicio -->
          <li>
            <a
              [routerLink]="'/home'"
              class="block py-2 px-3 rounded-sm
                     text-white hover:bg-white/10
                     md:hover:bg-transparent md:hover:text-blue-300
                     md:p-0"
              aria-current="page"
            >
              Inicio
            </a>
          </li>

          <!-- Categorías con dropdown -->
          <li class="relative" data-dropdown-root="categorias">
            <button
              data-dropdown="categorias"
              (click)="toggleCategoriasDropdown($event)"
              class="flex items-center py-2 px-3 rounded-sm
                     text-white hover:bg-white/10
                     md:hover:bg-transparent md:hover:text-blue-300
                     md:p-0"
            >
              Categorías
              <svg
                class="ml-1 w-4 h-4 transition-transform"
                [class.rotate-180]="isCategoriasDropdownOpen"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  fill-rule="evenodd"
                  d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
                  clip-rule="evenodd"
                ></path>
              </svg>
            </button>

            @if (isCategoriasDropdownOpen) {
            <div
              class="absolute top-full left-0 mt-2 w-64 bg-white rounded-lg shadow-lg
                     border border-gray-200 z-50"
            >
              <div class="py-2">
                <button
                  (click)="navegarACatalogoCompleto($event)"
                  class="w-full text-left block px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 transition-colors"
                >
                  <div class="font-medium">Todo el catálogo</div>
                  <div class="text-xs text-gray-500 mt-1">Ver todos los productos</div>
                </button>

                <button
                  (click)="navegarACategoria(1, $event)"
                  class="w-full text-left block px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 transition-colors"
                >
                  <div class="font-medium">Cocción y Parrillas</div>
                  <div class="text-xs text-gray-500 mt-1">Cocinas, parrillas, planchas...</div>
                </button>

                <button
                  (click)="navegarACategoria(2, $event)"
                  class="w-full text-left block px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 transition-colors"
                >
                  <div class="font-medium">Refrigeración</div>
                  <div class="text-xs text-gray-500 mt-1">Cámaras frías, vitrinas, congeladores</div>
                </button>

                <button
                  (click)="navegarACategoria(3, $event)"
                  class="w-full text-left block px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 transition-colors"
                >
                  <div class="font-medium">Acero Inoxidable</div>
                  <div class="text-xs text-gray-500 mt-1">Mesas, estantes y fregaderos</div>
                </button>
              </div>
            </div>
            }
          </li>

          <!-- Servicios con dropdown -->
          <li class="relative">
            <button
              data-dropdown="servicios"
              (click)="toggleServiciosDropdown($event)"
              class="flex items-center py-2 px-3 rounded-sm
                     text-white hover:bg-white/10
                     md:hover:bg-transparent md:hover:text-blue-300
                     md:p-0"
            >
              Servicios
              <svg
                class="ml-1 w-4 h-4 transition-transform"
                [class.rotate-180]="isServiciosDropdownOpen"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  fill-rule="evenodd"
                  d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
                  clip-rule="evenodd"
                ></path>
              </svg>
            </button>

            @if (isServiciosDropdownOpen) {
            <div
              class="absolute top-full left-0 mt-2 w-64 bg-white rounded-lg shadow-lg
                     border border-gray-200 z-50"
            >
              <div class="py-2">
                <button
                  (click)="navegarAServicios(4, $event)"
                  class="w-full text-left block px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 transition-colors"
                >
                  <div class="font-medium">Proyecto a la Medida</div>
                  <div class="text-xs text-gray-500 mt-1">Diseños personalizados para tu cocina</div>
                </button>
                <button
                  (click)="navegarAServicios(2, $event)"
                  class="w-full text-left block px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 transition-colors"
                >
                  <div class="font-medium">Soporte Técnico o Mantenimiento</div>
                  <div class="text-xs text-gray-500 mt-1">Mantenimiento y reparación de equipos</div>
                </button>
                <button
                  (click)="navegarAServicios(3, $event)"
                  class="w-full text-left block px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 transition-colors"
                >
                  <div class="font-medium">Citas de Inspección</div>
                  <div class="text-xs text-gray-500 mt-1">Evaluación y análisis de espacios</div>
                </button>
              </div>
            </div>
            }
          </li>

          <!-- Proyectos -->
          <li>
            <a
              [routerLink]='"/proyectos"'
              class="block py-2 px-3 rounded-sm
                     text-white hover:bg-white/10
                     md:hover:bg-transparent md:hover:text-blue-300
                     md:p-0"
            >
              Proyectos
            </a>
          </li>

          <!-- Sobre Nosotros -->
          <li>
            <a
              [routerLink]="'/about-us'"
              class="block py-2 px-3 rounded-sm
                     text-white hover:bg-white/10
                     md:hover:bg-transparent md:hover:text-blue-300
                     md:p-0"
            >
              Sobre Nosotros
            </a>
          </li>

          <!-- Login / Usuario -->
          <li>
            @if (srvAuth.isLoggedIn()) {
            <button
              class="mt-1 md:mt-0 flex items-center gap-2
                     bg-black text-white text-sm font-medium
                     px-4 py-2 rounded-md hover:bg-gray-800 transition-colors"
              [matMenuTriggerFor]="menu"
              #menuTrigger
            >
              <mat-icon>person</mat-icon>
              <h1 class="truncate max-w-[150px] sm:max-w-[200px]">
                {{ srvAuth.userActual.nombre }}
              </h1>
            </button>

            <mat-menu #menu="matMenu">
              <button
                class="bg-neutral-900 text-white"
                (click)="cambiarContrasena()"
                mat-menu-item
              >
                Cambiar Contraseña
              </button>
              <button (click)="cerrarSesion()" mat-menu-item>
                Cerrar Sesión
              </button>
            </mat-menu>
            }
            @else {
            <button
              (click)="signin()"
              class="mt-1 md:mt-0 bg-black text-white text-sm font-medium
                     px-4 py-2 rounded-md hover:bg-gray-800 transition-colors"
            >
              Inicio Sesión
            </button>
            }
          </li>
        </ul>
      </div>
    </div>
  </div>
</header>
